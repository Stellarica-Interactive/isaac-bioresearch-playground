[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-bioresearch"
version = "0.1.0"
description = "Embodied, biologically derived nervous-system models in NVIDIA Isaac Sim"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Gabor Bacsi" }]
keywords = ["connectome", "c-elegans", "drosophila", "isaac-sim", "computational-neuroscience"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Deliberately minimal. Downloads use stdlib urllib.request, CLIs use argparse,
# manifests use stdlib tomllib. We do not depend on a neuroscience framework in
# order to implement a small set of equations we want to understand ourselves.
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
viz = ["matplotlib>=3.8"]

[project.scripts]
inspect-connectome = "tools.inspect_connectome:main"
fetch-datasets = "tools.fetch_datasets:main"
build-datasets = "tools.build_datasets:main"

[project.urls]
Repository = "https://github.com/BacheyG/isaac-bioresearch-playground"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "worm*", "fly*", "tools*"]

[tool.setuptools.package-data]
"worm.data" = ["*.toml", "annotations/*.csv", "normalized/**/*", "circuits/*.json"]
"worm.neural" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["worm/tests", "common/tests"]
markers = [
    "requires_raw: needs a raw source file that is not committed (run tools/fetch_datasets.py)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
