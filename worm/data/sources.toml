# Published source datasets for Caenorhabditis elegans.
#
# These files are NOT redistributed in this repository. Fetch them with:
#
#     python tools/fetch_datasets.py --organism worm --all
#
# Every entry records the exact retrieval URL, a SHA-256 of the bytes we parsed,
# the licence under which the file is distributed, and the citation for the work
# that produced the data. If a hash stops matching, the upstream file changed and
# our committed derived data must be rebuilt and re-reviewed, not silently accepted.
#
# `mirror_note` records that we download from the OpenWorm Connectome Toolbox's
# MIT-licensed vendored copy rather than the publisher's site, because the
# publisher-hosted supplementary files are behind redirects that are not stable
# to script. The scientific citation is always the original paper.

