# ---------------------------------------------------------------------------
# Nicoletti et al. - conductance-based models of individual neurons
# ---------------------------------------------------------------------------
# These are not connectomes. They are Hodgkin-Huxley style models of a handful of
# SPECIFIC named cells, fitted to voltage-clamp recordings of C. elegans channels
# (or homologues where no worm recording exists). They matter because our graded
# leaky integrator has no intrinsic currents and therefore cannot oscillate at all
# (docs/model_assumptions.md 5C.9), and these are the only published sources of
# measured intrinsic dynamics for cells in our network.
#
# IMPORTANT: the 2019 paper carries a published Correction. A plus sign is missing
# from a Boltzmann denominator in the Methods, and supplementary equations A1, A6,
# A10, A15, A22, A25, A28, B1, B3, B6, B11 and B13 are wrong as printed. The
# authors' own XPPAUT source does not have these errors -- it is the code they
# actually ran -- so the CODE is our source of truth and the corrected paper is the
# cross-check. Never transcribe these equations from the original PDF.

[nicoletti_2019_rmd_awc]
kind = "neuron_model"
url = "https://raw.githubusercontent.com/ModelDBRepository/267187/master/RMD.ode"
filename = "RMD.ode"
sha256 = "b977f208ad21a449cd1f3049973e0791a95f565ab3d3a623075817d1b0ac9f87"
license = "ModelDB entry 267187; no licence file is supplied with the code. We do not redistribute it. Parameters are re-derived into our own implementation and cited; the paper itself is CC-BY 4.0 (PLOS ONE)."
citation = "Nicoletti M, Loppini A, Chiodo L, Folli V, Ruocco G, Filippi S. Biophysical modeling of C. elegans neurons: Single ion currents and whole-cell dynamics of AWCon and RMD. PLoS ONE 14(7):e0218738 (2019)."
doi = "10.1371/journal.pone.0218738"
correction_doi = "10.1371/journal.pone.0256930"
mirror_note = "XPPAUT source from ModelDB 267187 (github.com/ModelDBRepository/267187). RMD is a head motor neuron with plateau potentials that innervates body wall muscle directly. 22 state variables, 10 channel types (SHL-1, SHK-1, EGL-36, IRK, UNC-2, EGL-19, CCA-1, SLO-1, SLO-2, KCNL), calcium nanodomains, C=1.2 pF, g_leak=0.4 nS. Units are mV/nS/pF/pA, matching our runtime."

