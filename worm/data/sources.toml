# Published source datasets for Caenorhabditis elegans.
#
# These files are NOT redistributed in this repository. Fetch them with:
#
#     python tools/fetch_datasets.py --organism worm --all
#
# Every entry records the exact retrieval URL, a SHA-256 of the bytes we parsed,
# the licence under which the file is distributed, and the citation for the work
# that produced the data. If a hash stops matching, the upstream file changed and
# our committed derived data must be rebuilt and re-reviewed, not silently accepted.
#
# `mirror_note` records that we download from the OpenWorm Connectome Toolbox's
# MIT-licensed vendored copy rather than the publisher's site, because the
# publisher-hosted supplementary files are behind redirects that are not stable
# to script. The scientific citation is always the original paper.

# ---------------------------------------------------------------------------
# Witvliet et al. 2021 - eight individual brains across development
# ---------------------------------------------------------------------------
# IMPORTANT: these are BRAIN (nerve ring and adjacent ganglia) reconstructions.
# They contain no ventral-cord motor neurons and only the anterior eight body
# wall muscle segments. They cannot support a model of crawling locomotion.

[witvliet_2021_1]
kind = "connectome"
url = "https://raw.githubusercontent.com/openworm/ConnectomeToolbox/main/cect/data/witvliet_2020_1%20L1.xlsx"
filename = "witvliet_2020_1 L1.xlsx"
sha256 = "e988deaa25d290786434a23131c1bf3f144e3ca07980233a6edbfcfb8d4d30be"
license = "MIT (openworm/ConnectomeToolbox redistribution of published supplementary data)"
citation = "Witvliet D, Mulcahy B, Mitchell JK, Meirovitch Y, Berger DR, Wu Y, Liu Y, Koh WX, Parvathala R, Holmyard D, Schalek RL, Shavit N, Chisholm AD, Lichtman JW, Samuel ADT, Zhen M. Connectomes across development reveal principles of brain maturation. Nature 596:257-261 (2021)."
doi = "10.1038/s41586-021-03778-8"
mirror_note = "Original data also at nemanode.org and bossdb.org/project/witvliet2020"
stage = "L1"
scope = "head"

