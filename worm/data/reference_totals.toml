# Externally published totals, used as oracles for our importers.
#
# These numbers are NOT produced by our code. They are quoted from an independent
# analysis of the same source files (the OpenWorm C. elegans Connectome Toolbox
# dataset factsheets) so that our parser can be checked against something that did
# not come from our parser. `worm/tests/` asserts agreement; the CLI command
#
#     python tools/inspect_connectome.py --dataset <id> verify
#
# reports it.
#
# CONVENTIONS -- these matter, and getting them wrong is the easiest way to
# "verify" a broken parser:
#
#   chemical_edges / chemical_weight
#       Directed. One entry per ordered (pre, post) pair.
#
#   electrical_edges_directed / electrical_weight_directed
#       Gap junctions counted the way an adjacency matrix counts them: every
#       non-self junction appears TWICE (once per direction) with the same weight;
#       a self-junction appears ONCE.
#
#       We store gap junctions once, undirected. The relationship is
#
#           directed_entries = 2 * (stored - self_loops) + self_loops
#           directed_weight  = 2 *  stored_weight - self_loop_weight
#
#       Note the asymmetry in the second formula: it is why dataset 8's published
#       weight is 851 (odd) rather than 852. That dataset contains a weight-2 gap
#       junction from AIZR to itself, and the diagonal of a symmetric matrix is
#       written once, not twice. Every one of the eight datasets contains such
#       self-junctions -- a gap junction between two processes of the same cell --
#       so this is a systematic feature of the reconstruction, not an artefact.
#
#   other_cells
#       Cells that are neither neurons nor muscles. Our schema splits these into
#       `glia` (the CEPsh sheath cells) and `other` (the GLR mesodermal cells);
#       the published figure is their sum.
#
# Source for every number below:
#   OpenWorm C. elegans Connectome Toolbox dataset factsheets,
#   https://openworm.org/ConnectomeToolbox/Witvliet<N>_data/ (retrieved 2026-09-08),
#   derived from Witvliet D, et al., Nature 596:257-261 (2021).

